<style>
/* Design tokens: context/docs/design/design-guidelines.md (dark default, light via data-theme) */
:root {
  color-scheme: dark;
  --bg-primary: #171717; --bg-secondary: #1b1b1b; --bg-tertiary: #1d1d1d; --bg-quaternary: #222222;
  --bg-trans-lighter: rgba(255,255,255,.03); --bg-trans-light: rgba(255,255,255,.06); --bg-trans-medium: rgba(255,255,255,.10);
  --border-strong: #484848; --border-medium: #222222; --border-light: #1d1d1d;
  --text-primary: #ebebeb; --text-secondary: #b3b3b3; --text-tertiary: #818181; --text-light: #666666; --text-inverted: #171717;
  --accent: #4864d6; --accent-hover: #5a74dd; --accent-text: #a1b0ff; --accent-bg: #1b2446;
  --danger: #d4544f; --danger-bg: #361519; --danger-border: rgba(212,84,79,.4);
  --tag-gray-text: #b3b3b3;   --tag-gray-bg: #232323;
  --tag-blue-text: #a1b0ff;   --tag-blue-bg: #1b2446;
  --tag-purple-text: #cc9eff; --tag-purple-bg: #2d1d39;
  --tag-green-text: #6ed392;  --tag-green-bg: #1a2c22;
  --tag-orange-text: #ffa161; --tag-orange-bg: #301f0e;
  --tag-amber-text: #ffcc4a;  --tag-amber-bg: #2d2008;
  --tag-red-text: #ff918c;    --tag-red-bg: #361519;
  --shadow-float: 0 4px 16px rgba(0,0,0,.4);
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: .85rem; --fs-sm: .92rem; --fs-md: 1rem; --fs-lg: 1.23rem; --fs-xl: 1.54rem; --fs-xxl: 1.85rem;
  --sp-0_5: 2px; --sp-1: 4px; --sp-1_5: 6px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px;
  --h-md: 32px; --h-sm: 24px; --h-tag: 20px; --h-nav: 28px;
  --r-xs: 2px; --r-sm: 4px; --r-md: 8px; --r-lg: 16px; --r-pill: 999px;
  --sidebar-w: 220px; --list-w: 360px;
  --t-fast: .1s ease;
}
[data-theme="light"] {
  color-scheme: light;
  --bg-primary: #ffffff; --bg-secondary: #fcfcfc; --bg-tertiary: #f1f1f1; --bg-quaternary: #ebebeb;
  --bg-trans-lighter: rgba(0,0,0,.02); --bg-trans-light: rgba(0,0,0,.04); --bg-trans-medium: rgba(0,0,0,.08);
  --border-strong: #d6d6d6; --border-medium: #ebebeb; --border-light: #f1f1f1;
  --text-primary: #333333; --text-secondary: #666666; --text-tertiary: #999999; --text-light: #b3b3b3; --text-inverted: #ffffff;
  --accent-text: #415ac1; --accent-bg: #eef2fd;
  --danger-bg: #fbecec;
  --tag-gray-text: #666666;   --tag-gray-bg: #f3f3f3;
  --tag-blue-text: #415ac1;   --tag-blue-bg: #eef2fd;
  --tag-purple-text: #7948af; --tag-purple-bg: #f6eefc;
  --tag-green-text: #307f51;  --tag-green-bg: #e9f6ec;
  --tag-orange-text: #c25600; --tag-orange-bg: #fcefd8;
  --tag-amber-text: #a36600;  --tag-amber-bg: #fef7c8;
  --tag-red-text: #be3b38;    --tag-red-bg: #fbecec;
  --shadow-float: 0 4px 16px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
html { font-size: 13px; height: 100%; }
body { margin: 0; height: 100%; background: var(--bg-tertiary); color: var(--text-primary); font: var(--fs-md)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.card h3 .icon, .kpi .l .icon { width: 14px; height: 14px; stroke-width: 1.6; }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- app shell: sidebar + page ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); height: 100%; }
.sidebar { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3) var(--sp-2); background: transparent; min-height: 0; }
.brand { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) var(--sp-2); font-weight: 600; }
.brand .mark { width: 20px; height: 20px; border-radius: var(--r-sm); background: var(--accent); color: #fff; display: grid; place-items: center; }
.brand .mark .icon { width: 13px; height: 13px; }
.brand small { display: block; color: var(--text-tertiary); font-weight: 400; font-size: var(--fs-xs); line-height: 1.1; }
.live { display: inline-flex; align-items: center; gap: var(--sp-1_5); color: var(--text-tertiary); font-size: var(--fs-sm); padding: 0 var(--sp-2) var(--sp-2); }
.dot { width: 6px; height: 6px; border-radius: var(--r-pill); background: var(--text-light); }
.dot.on { background: var(--tag-green-text); }
.dot.retry { background: var(--tag-amber-text); }
.nav-label { color: var(--text-light); font-size: var(--fs-xs); font-weight: 500; padding: var(--sp-2) var(--sp-2) 0; }
.tabs { display: flex; flex-direction: column; gap: var(--sp-0_5); }
.tab { height: var(--h-nav); display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2); border: 0; border-radius: var(--r-sm); background: none; color: var(--text-secondary); text-align: left; transition: background var(--t-fast); }
.tab:hover { background: var(--bg-trans-light); }
.tab.active { background: var(--bg-trans-medium); color: var(--text-primary); font-weight: 500; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--sp-1); }
.sidebar-foot .btn { width: 100%; justify-content: flex-start; }

.page { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: var(--sp-2) var(--sp-2) var(--sp-2) 0; }
.page-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--bg-primary); border: 1px solid var(--border-medium); border-radius: var(--r-md); overflow: hidden; }
.page-head { height: 48px; flex: none; display: flex; align-items: center; gap: var(--sp-4); padding: 0 var(--sp-4); border-bottom: 1px solid var(--border-medium); }
.page-title { display: flex; align-items: center; gap: var(--sp-2); font-weight: 500; }
.page-title .icon { color: var(--text-tertiary); }
.kpis { display: flex; gap: var(--sp-4); margin-left: auto; font-size: var(--fs-sm); color: var(--text-tertiary); }
.kpis b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- buttons ---------- */
.btn { height: var(--h-md); display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-1_5); padding: 0 var(--sp-2); border: 1px solid var(--bg-trans-light); border-radius: var(--r-md); background: var(--bg-trans-lighter); color: var(--text-secondary); font-weight: 500; white-space: nowrap; transition: background var(--t-fast); }
.btn:hover { background: var(--bg-tertiary); }
.btn:active { background: var(--bg-quaternary); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger-border); }
.btn.danger.on { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--bg-trans-light); }
.banner { display: none; padding: var(--sp-2) var(--sp-4); background: var(--danger-bg); color: var(--tag-red-text); border-bottom: 1px solid var(--danger-border); font-weight: 500; }
.banner.show { display: block; }

/* ---------- views ---------- */
main { flex: 1; min-height: 0; }
.view { display: none; height: 100%; }
.view.active { display: flex; }
#sessions-view { display: none; }
#sessions-view.active { display: grid; grid-template-columns: var(--list-w) minmax(0, 1fr); }
aside { border-right: 1px solid var(--border-medium); display: flex; flex-direction: column; min-height: 0; }
.search { margin: var(--sp-3) var(--sp-3) var(--sp-2); height: var(--h-md); display: flex; align-items: center; gap: var(--sp-2); border: 1px solid var(--border-medium); border-radius: var(--r-sm); padding: 0 var(--sp-2); color: var(--text-tertiary); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text-primary); outline: none; font: inherit; }
.search input::placeholder { color: var(--text-light); }
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-1); padding: 0 var(--sp-3) var(--sp-3); border-bottom: 1px solid var(--border-medium); }
.chip { height: var(--h-tag); padding: 0 var(--sp-2); border: 0; border-radius: var(--r-sm); background: var(--bg-trans-light); color: var(--text-secondary); font-size: var(--fs-sm); line-height: 1.1; transition: background var(--t-fast); }
.chip:hover { background: var(--bg-trans-medium); }
.chip.active { background: var(--accent-bg); color: var(--accent-text); font-weight: 500; }
.list { overflow: auto; flex: 1; }
.row { padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border-light); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: var(--sp-0_5) var(--sp-2); transition: background var(--t-fast); }
.row:hover { background: var(--bg-tertiary); }
.row.sel { background: var(--bg-quaternary); box-shadow: inset 2px 0 0 var(--accent); }
.row.attn { box-shadow: inset 2px 0 0 var(--tag-orange-text); }
.row .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--text-tertiary); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd { font-family: var(--mono); font-size: var(--fs-sm); color: var(--text-tertiary); text-align: right; font-variant-numeric: tabular-nums; }
.cd.amber { color: var(--tag-orange-text); } .cd.red { color: var(--danger); font-weight: 600; }
.pill { display: inline-flex; align-items: center; height: var(--h-tag); padding: 0 var(--sp-2); border-radius: var(--r-sm); font-size: var(--fs-sm); line-height: 1.1; vertical-align: middle; background: var(--tag-gray-bg); color: var(--tag-gray-text); }
.pill.pricing { background: var(--tag-blue-bg); color: var(--tag-blue-text); }
.pill.quoted { background: var(--tag-purple-bg); color: var(--tag-purple-text); }
.pill.accepted, .pill.booked, .pill.confirmed, .pill.answered { background: var(--tag-green-bg); color: var(--tag-green-text); }
.pill.error, .pill.lost, .pill.expired { background: var(--tag-red-bg); color: var(--tag-red-text); }
.pill.paused { background: var(--tag-amber-bg); color: var(--tag-amber-text); }
.pill.manual { background: var(--tag-orange-bg); color: var(--tag-orange-text); }
.section-title { padding: var(--sp-3) var(--sp-3) var(--sp-1); font-size: var(--fs-xs); font-weight: 500; color: var(--text-tertiary); }

/* ---------- detail ---------- */
.detail { overflow: auto; padding: var(--sp-6); min-width: 0; }
.empty { color: var(--text-tertiary); margin: auto; text-align: center; }
.d-head { display: flex; align-items: flex-start; gap: var(--sp-4); flex-wrap: wrap; }
.d-head h2 { margin: 0; font-size: var(--fs-xl); font-weight: 600; line-height: 1.3; }
.d-sub { color: var(--text-tertiary); font-size: var(--fs-md); margin-top: var(--sp-1); }
.d-cd { margin-left: auto; font-size: var(--fs-xxl); }
.actions { display: flex; gap: var(--sp-2); margin: var(--sp-4) 0; flex-wrap: wrap; }
.notice { padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); background: var(--tag-orange-bg); color: var(--tag-orange-text); margin-bottom: var(--sp-4); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--sp-4); }
.card { background: var(--bg-primary); border: 1px solid var(--border-medium); border-radius: var(--r-md); padding: var(--sp-4); min-width: 0; }
.card h3 { margin: 0 0 var(--sp-3); font-size: var(--fs-sm); color: var(--text-tertiary); font-weight: 500; display: flex; gap: var(--sp-1_5); align-items: center; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 64px 1fr auto; gap: var(--sp-2); padding: var(--sp-1_5) 0; border-bottom: 1px solid var(--border-light); }
.tl li:last-child { border-bottom: 0; }
.tl .t, .tl .x { color: var(--text-light); font-family: var(--mono); font-size: var(--fs-xs); padding-top: 1px; }
.tl li.warn .m { color: var(--tag-orange-text); } .tl li.error .m { color: var(--danger); }
.tl li.new-ev { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--accent-bg); } to { background: transparent; } }
.tl details { grid-column: 2 / 4; } .tl summary { color: var(--text-light); font-size: var(--fs-xs); cursor: pointer; }
.tl pre, .mail pre { white-space: pre-wrap; word-break: break-word; margin: var(--sp-2) 0 0; font: var(--fs-xs)/1.5 var(--mono); color: var(--text-secondary); }
.mail { padding: var(--sp-3); border-radius: var(--r-md); background: var(--bg-tertiary); margin-bottom: var(--sp-2); }
.mail.out { background: var(--accent-bg); }
.mail .h { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--text-tertiary); }
.why table, .tbl { width: 100%; border-collapse: collapse; }
.why td, .why th, .tbl td, .tbl th { height: var(--h-md); padding: 0 var(--sp-2); border-bottom: 1px solid var(--border-light); text-align: left; }
.tbl th, .why th { color: var(--text-tertiary); font-weight: 500; font-size: var(--fs-sm); }
.tbl tr:not(:first-child):hover td { background: var(--bg-tertiary); }
.num { text-align: right !important; font-variant-numeric: tabular-nums; }
.chosen td { color: var(--tag-green-text); font-weight: 500; }
textarea { width: 100%; min-height: 120px; background: transparent; color: var(--text-primary); border: 1px solid var(--border-medium); border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3); font: inherit; resize: vertical; }
textarea:focus { outline: none; border-color: var(--accent); }

/* ---------- dashboard ---------- */
#dashboard-view { flex-direction: column; overflow: auto; padding: var(--sp-6); gap: var(--sp-4); }
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-4); }
.kpi { background: var(--bg-primary); border: 1px solid var(--border-medium); border-radius: var(--r-md); padding: var(--sp-4); }
.kpi .l { color: var(--text-tertiary); font-size: var(--fs-sm); font-weight: 500; display: flex; gap: var(--sp-1_5); align-items: center; }
.kpi .v { font-size: var(--fs-xxl); font-weight: 600; margin-top: var(--sp-1); font-variant-numeric: tabular-nums; line-height: 1.3; }
.kpi .s { color: var(--text-light); font-size: var(--fs-sm); }
.kpi .v.ok { color: var(--tag-green-text); } .kpi .v.warn { color: var(--tag-orange-text); } .kpi .v.bad { color: var(--danger); }
.stack { display: flex; height: 8px; border-radius: var(--r-xs); overflow: hidden; background: var(--bg-tertiary); gap: 1px; }
.stack span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-3); font-size: var(--fs-sm); color: var(--text-secondary); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: var(--r-xs); margin-right: var(--sp-1); }
.bars { display: flex; align-items: flex-end; gap: var(--sp-1); height: 140px; position: relative; padding-top: var(--sp-2); }
.bars .b { flex: 1; min-width: 6px; background: var(--accent); border-radius: var(--r-xs) var(--r-xs) 0 0; position: relative; }
.bars .b.ok { background: var(--tag-green-text); } .bars .b.warn { background: var(--tag-orange-text); } .bars .b.bad { background: var(--danger); }
.bars .b.ghost { background: var(--bg-quaternary); }
.bars .line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border-strong); font-size: var(--fs-xs); color: var(--text-light); }
.bars .line span { position: absolute; right: 0; top: -16px; }
.axis { display: flex; gap: var(--sp-1); font-size: var(--fs-xs); color: var(--text-light); margin-top: var(--sp-1); }
.axis span { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; }
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
.ticker { max-height: 260px; overflow: auto; }

/* status colours for the dashboard stack (read by JS via var(--st-*)) */
:root, [data-theme="light"] {
  --st-new: var(--tag-gray-text); --st-pricing: var(--tag-blue-text); --st-quoted: var(--tag-purple-text);
  --st-booked: var(--tag-green-text); --st-error: var(--tag-red-text); --ok: var(--tag-green-text);
  --warn: var(--tag-orange-text); --bad: var(--danger);
}

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .sidebar { flex-direction: row; align-items: center; flex-wrap: wrap; padding: var(--sp-2); }
  .nav-label, .live { display: none; }
  .tabs { flex-direction: row; }
  .sidebar-foot { margin: 0 0 0 auto; flex-direction: row; }
  .sidebar-foot .btn span { display: none; }
  .page { padding: 0 var(--sp-2) var(--sp-2); }
  .kpis { display: none; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash-grid, .grid2 { grid-template-columns: 1fr; }
  #sessions-view.active { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  aside { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--border-medium); }
}
</style>

<script>
"use strict";
// ---------- helpers (all text via textContent: mail bodies are untrusted) ----------
const $ = (s) => document.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
function icon(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", "icon");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#i-" + name); s.append(u); return s;
}
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.text()) || r.status);
  return r.json();
};
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
const money = (minor, cur) => minor == null ? "–" : (minor / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + (cur || "");
const usd = (micro) => micro == null ? "–" : "$" + (micro / 1e6).toFixed(micro < 10000 ? 4 : 3);
const time = (iso) => iso ? new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
const secs = (s) => s == null ? "–" : (s < 60 ? Math.round(s) + " s" : Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0") + " min");
const STATUS_DE = { new: "neu", pricing: "bepreisen", quoted: "quotiert", accepted: "angenommen", booked: "gebucht", confirmed: "bestätigt", answered: "beantwortet", lost: "verloren", expired: "abgelaufen", error: "Fehler" };
const OPEN = ["new", "pricing"];

// scoring helpers (brief: cost 40 pts, 0 at $0.10; time 15 pts, full ≤2 min, 0 at 6 min)
const costPts = (micro) => micro == null ? null : Math.max(0, 40 * (1 - micro / 100000));
const timePts = (s) => s == null ? null : s <= 120 ? 15 : s >= 360 ? 0 : 15 * (360 - s) / 240;

// ---------- state ----------
const state = { filter: "all", q: "", selected: null, sessions: [], detail: null, lastEventId: 0, seen: new Set(), globalPause: false, view: "sessions-view" };
const FILTERS = [
  ["all", "Alle"], ["attention", "Achtung"], ["open", "Offen"], ["quoted", "Quotiert"],
  ["booked", "Gebucht"], ["problem", "Fehler/verloren"], ["tracking", "Tracking"],
];

// ---------- countdown ----------
function remaining(deadline) { return deadline ? (new Date(deadline) - Date.now()) / 1000 : null; }
function cdText(s, status) {
  if (!OPEN.includes(status) || s == null) return "";
  if (s <= 0) return "0:00";
  return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
}
function cdClass(s) { return s == null ? "" : s < 60 ? "red" : s < 120 ? "amber" : ""; }
setInterval(() => {
  document.querySelectorAll("[data-deadline]").forEach((n) => {
    const s = remaining(n.dataset.deadline);
    n.textContent = cdText(s, n.dataset.status);
    n.classList.remove("red", "amber");
    const c = cdClass(s); if (c && OPEN.includes(n.dataset.status)) n.classList.add(c);
  });
}, 1000);

// ---------- list ----------
function renderChips() {
  const box = $("#chips"); box.replaceChildren();
  for (const [k, label] of FILTERS) box.append(el("button", { class: "chip" + (state.filter === k ? " active" : ""), onclick: () => { state.filter = k; renderChips(); renderList(); } }, label));
}
function matches(s) {
  const f = state.filter;
  if (f === "attention" && !s.needs_attention) return false;
  if (f === "open" && !OPEN.includes(s.status)) return false;
  if (f === "quoted" && s.status !== "quoted") return false;
  if (f === "booked" && !["accepted", "booked", "confirmed"].includes(s.status)) return false;
  if (f === "problem" && !["error", "lost", "expired"].includes(s.status)) return false;
  if (f === "tracking" && s.kind !== "tracking") return false;
  if (state.q) {
    const q = state.q.toLowerCase();
    if (!String(s.id).includes(q) && !(s.customer || "").toLowerCase().includes(q) && !(s.subject || "").toLowerCase().includes(q)) return false;
  }
  return true;
}
function statusPills(s) {
  return [
    el("span", { class: "pill " + s.status }, STATUS_DE[s.status] || s.status),
    s.paused ? el("span", { class: "pill paused" }, "pausiert") : null,
    s.mode === "manual" ? el("span", { class: "pill manual" }, "Mensch") : null,
  ];
}
function renderList() {
  const box = $("#list"); box.replaceChildren();
  const rows = state.sessions.filter(matches);
  if (!rows.length) box.append(el("div", { class: "empty", style: "padding:24px" }, state.sessions.length ? "Keine Session für diesen Filter." : "Noch keine Sessions. Sobald Mails ankommen, erscheinen sie hier."));
  for (const s of rows) {
    const s_rem = remaining(s.deadline_at);
    box.append(el("div", {
      class: "row" + (s.id === state.selected ? " sel" : "") + (s.needs_attention ? " attn" : ""),
      onclick: () => select(s.id),
    },
      el("div", { class: "title" }, (s.kind === "tracking" ? "Tracking · " : "") + (s.subject || "(ohne Betreff)")),
      el("div", { class: "cd " + cdClass(s_rem), "data-deadline": s.deadline_at || "", "data-status": s.status }, cdText(s_rem, s.status)),
      el("div", { class: "meta" }, statusPills(s), " ", s.customer || ""),
      el("div", { class: "meta num" }, s.quote_total_minor != null ? money(s.quote_total_minor, s.quote_currency) : ""),
      el("div", { class: "meta", style: "grid-column:1/3" }, s.last_event || ""),
    ));
  }
  loadUnassigned(box);
}
let unassignedToken = 0;
async function loadUnassigned(box) {
  if (state.filter !== "all" || state.q) return;
  const token = ++unassignedToken;
  const un = await api("/api/unassigned").catch(() => []);
  if (token !== unassignedToken || !un.length) return; // a newer render took over
  box.append(el("div", { class: "section-title" }, `Unzugeordnet (${un.length})`));
  for (const m of un.slice(0, 20)) box.append(el("div", { class: "row", style: "cursor:default" },
    el("div", { class: "title" }, m.subject || "(ohne Betreff)"), el("div", { class: "cd" }, time(m.received_at)),
    el("div", { class: "meta", style: "grid-column:1/3" }, (m.category || "") + " · " + (m.sender || m.recipient || ""))));
}
async function loadSessions() {
  state.sessions = await api("/api/sessions").catch(() => state.sessions);
  renderList();
}

// ---------- detail ----------
async function select(id) {
  state.selected = id;
  history.replaceState(null, "", "#session=" + id);
  renderList();
  await loadDetail();
}
async function loadDetail() {
  if (state.selected == null) return;
  try { state.detail = await api("/api/sessions/" + state.selected); }
  catch { $("#detail").replaceChildren(el("div", { class: "empty" }, "Session nicht gefunden.")); return; }
  renderDetail();
}
function act(path, confirmText) {
  return async () => {
    if (confirmText && !confirm(confirmText)) return;
    try { await post(`/api/sessions/${state.selected}/${path}`); } catch (e) { alert("Fehler: " + e.message); }
    await Promise.all([loadDetail(), loadSessions()]);
  };
}
function lane(s) {
  const r = s.request || {};
  const q = (s.quotes || [])[0] || {};
  const o = r.origin || q.origin, d = r.destination || q.destination;
  const parts = [];
  if (o || d) parts.push(`${o || "?"} → ${d || "?"}`);
  if (r.weight_kg) parts.push(r.weight_kg + " kg");
  if (r.volume_cbm) parts.push(r.volume_cbm + " cbm");
  if (r.mode || r.preference) parts.push(r.mode || r.preference);
  return parts.join(" · ");
}
function renderDetail() {
  const s = state.detail, box = $("#detail");
  const rem = remaining(s.deadline_at);
  const head = el("div", { class: "d-head" },
    el("div", {},
      el("h2", {}, lane(s) || s.subject || "Session " + s.id),
      el("div", { class: "d-sub" }, statusPills(s), "  ", s.customer || "", " · Session ", String(s.id), " · LLM ", usd(s.llm_cost_micro_usd)),
    ),
    el("div", { class: "d-cd cd " + cdClass(rem), "data-deadline": s.deadline_at || "", "data-status": s.status }, cdText(rem, s.status)),
  );
  const actions = el("div", { class: "actions" },
    s.paused
      ? el("button", { class: "btn", onclick: act("resume") }, icon("play"), "Fortsetzen")
      : el("button", { class: "btn", onclick: act("pause") }, icon("pause"), "Pausieren"),
    s.mode === "manual"
      ? el("button", { class: "btn", onclick: act("handback") }, icon("undo"), "An Agent zurückgeben")
      : el("button", { class: "btn", onclick: act("takeover", "Session übernehmen? Der Agent sendet danach nichts mehr in diesem Thread.") }, icon("hand"), "Übernehmen"),
    el("button", { class: "btn primary", onclick: () => toggleReply(true) }, icon("send"), "Antworten…"),
  );
  const notices = [];
  if (s.mode === "manual") notices.push(el("div", { class: "notice" }, "Ein Mensch hat diese Session übernommen. Der Agent antwortet hier nicht mehr."));
  if (state.globalPause) notices.push(el("div", { class: "notice" }, "Globaler Stopp aktiv: es werden keine Mails gesendet."));

  const reply = el("div", { class: "card", id: "reply", style: "display:none;margin-bottom:16px" },
    el("h3", {}, icon("send"), "Manuelle Antwort im Kunden-Thread"),
    s.first_reply_at ? null : el("div", { class: "notice" }, "Achtung: Nur die erste Quote im Thread zählt. Gesendet ist gesendet."),
    el("textarea", { id: "reply-text", placeholder: "Hallo …" }),
    el("div", { class: "actions" },
      el("button", { class: "btn primary", onclick: sendReply }, icon("send"), "Senden"),
      el("button", { class: "btn", onclick: () => toggleReply(false) }, "Abbrechen")),
  );

  const tl = el("ul", { class: "tl", id: "timeline" });
  for (const e of s.events) tl.append(eventItem(e));
  const mails = el("div", {});
  for (const m of s.mails) mails.append(el("div", { class: "mail " + m.direction },
    el("div", { class: "h" }, el("span", {}, (m.direction === "in" ? "von " + (m.sender || "?") : "an " + (m.recipient || "?")) + (m.category ? " · " + m.category : "")), el("span", {}, time(m.received_at))),
    el("div", { style: "font-weight:600;margin-top:2px" }, m.subject || ""),
    el("details", {}, el("summary", {}, "Text"), el("pre", {}, m.body || ""))));
  if (!s.mails.length) mails.append(el("div", { class: "empty" }, "Keine Mails."));

  box.replaceChildren(head, actions, ...notices, reply, el("div", { class: "grid2" },
    el("div", {}, whyCard(s), el("div", { class: "card", style: "margin-top:16px" }, el("h3", {}, icon("activity"), "Timeline (live)"), tl)),
    el("div", {}, s.bookings.length ? bookingCard(s) : null, boardCard(s), el("div", { class: "card", style: "margin-top:16px" }, el("h3", {}, icon("mail"), "Mails im Thread"), mails)),
  ));
}
function eventItem(e, fresh) {
  const li = el("li", { class: (e.level || "") + (fresh ? " new-ev" : "") },
    el("span", { class: "t" }, time(e.created_at)),
    el("span", { class: "m" }, e.message || e.kind),
    el("span", { class: "x" }, [e.duration_ms != null ? e.duration_ms + " ms" : "", e.cost_micro_usd != null ? usd(e.cost_micro_usd) : ""].filter(Boolean).join(" · ")));
  if (e.payload) li.append(el("details", {}, el("summary", {}, "Details"), el("pre", {}, JSON.stringify(e.payload, null, 2))));
  return li;
}
function whyCard(s) {
  const q = (s.quotes || [])[0];
  const card = el("div", { class: "card why" }, el("h3", {}, icon("coin"), "Warum diese Quote"));
  if (!q) { card.append(el("div", { class: "empty", style: "text-align:left" }, OPEN.includes(s.status) ? "Noch keine Quote. Der Agent bepreist gerade." : "Keine Quote in dieser Session.")); return card; }
  card.append(el("div", { style: "margin-bottom:8px" },
    el("b", {}, money(q.total_minor, q.currency)), " · ", q.airline || "?", " · ", q.transit_days != null ? q.transit_days + " Tage" : "", " · Quelle: ", q.source,
    s.request && (s.request.mode || s.request.preference) ? " · gewünscht: " + (s.request.mode || s.request.preference) : ""));
  const alts = q.alternatives || [];
  if (alts.length) {
    const t = el("table", {}, el("tr", {}, el("th", {}, "Airline"), el("th", {}, "Quelle"), el("th", { class: "num" }, "Tage"), el("th", { class: "num" }, "Preis")));
    const sorted = [...alts].sort((a, b) => (a.total_minor ?? 1e18) - (b.total_minor ?? 1e18));
    for (const a of sorted) {
      const chosen = a.airline === q.airline && a.total_minor === q.total_minor;
      t.append(el("tr", { class: chosen ? "chosen" : "" }, el("td", {}, (chosen ? "✓ " : "") + (a.airline || "?")), el("td", {}, a.source || ""), el("td", { class: "num" }, a.transit_days ?? ""), el("td", { class: "num" }, money(a.total_minor, a.currency || q.currency))));
    }
    card.append(t);
  } else card.append(el("div", { class: "d-sub" }, "Keine Alternativen gespeichert."));
  return card;
}
function bookingCard(s) {
  const b = s.bookings[0];
  return el("div", { class: "card" }, el("h3", {}, icon("box"), "Buchung"),
    el("div", {}, el("b", {}, b.booking_reference || b.team_reference), " · ", el("span", { class: "pill " + (b.status === "failed" ? "error" : "booked") }, b.status)),
    el("div", { class: "d-sub" }, (b.airline || "") + " · " + money(b.price_minor, b.currency) + " · Rate " + (b.rate_id || "–")));
}
function boardCard(s) {
  const card = el("div", { class: "card", style: s.bookings.length ? "margin-top:16px" : "" }, el("h3", {}, icon("trophy"), "Board (5U-Bewertung)"));
  if (!s.board.length) card.append(el("div", { class: "d-sub" }, "Noch keine Bewertung."));
  for (const b of s.board) card.append(el("div", {}, el("span", { class: "pill " + (b.verdict === "accepted" ? "booked" : b.verdict === "rejected" ? "error" : "new") }, b.verdict || "?"), " ", b.reason || "", b.points_json ? " · " + b.points_json : ""));
  return card;
}
function toggleReply(show) { const r = $("#reply"); if (r) { r.style.display = show ? "block" : "none"; if (show) $("#reply-text").focus(); } }
async function sendReply() {
  const text = $("#reply-text").value.trim();
  if (!text) return;
  if (!confirm("Antwort jetzt an den Kunden senden? Die Session wird dabei übernommen.")) return;
  try { await post(`/api/sessions/${state.selected}/reply`, { text }); toggleReply(false); }
  catch (e) { alert("Senden fehlgeschlagen: " + e.message); }
  await Promise.all([loadDetail(), loadSessions()]);
}

// ---------- header KPIs + global pause ----------
async function loadStats() {
  const st = await api("/api/stats").catch(() => null);
  if (!st) return;
  state.globalPause = !!st.global_pause;
  const bs = st.by_status || {};
  const quoted = ["quoted", "accepted", "booked", "confirmed"].reduce((a, k) => a + (bs[k] || 0), 0);
  $("#kpis").replaceChildren(
    el("span", {}, el("b", {}, st.sessions_total), " Sessions"),
    el("span", {}, el("b", {}, quoted), " quotiert"),
    el("span", {}, "Ø ", el("b", {}, secs(st.avg_response_s)), " Antwort"),
    el("span", {}, "Ø ", el("b", {}, usd(st.avg_llm_cost_micro_usd_per_quote)), " LLM/Quote"),
    el("span", {}, el("b", {}, (st.board || {}).accepted || 0), " accepted"),
  );
  const gp = $("#global-pause");
  gp.classList.toggle("on", state.globalPause);
  gp.querySelector("span").textContent = state.globalPause ? "Mails wieder freigeben" : "Ausgehende Mails stoppen";
  $("#global-banner").classList.toggle("show", state.globalPause);
}
$("#global-pause").addEventListener("click", async () => {
  const stop = !state.globalPause;
  if (stop && !confirm("Alle ausgehenden Mails stoppen? Der Agent sendet dann nichts mehr, auch keine Quotes.")) return;
  await post(stop ? "/api/pause-all" : "/api/resume-all").catch((e) => alert(e.message));
  await loadStats(); if (state.detail) renderDetail();
});

// ---------- dashboard ----------
function kpi(ic, label, value, sub, cls) {
  return el("div", { class: "kpi" }, el("div", { class: "l" }, icon(ic), label), el("div", { class: "v " + (cls || "") }, value), el("div", { class: "s" }, sub || ""));
}
function barChart(values, { max, lines = [], cls = () => "", labels = [] } = {}) {
  const top = Math.max(max || 0, ...values.map((v) => v ?? 0), ...lines.map((l) => l.v), 1);
  const wrap = el("div", {});
  const bars = el("div", { class: "bars" });
  for (const l of lines) bars.append(el("div", { class: "line", style: `bottom:${(l.v / top) * 100}%` }, el("span", {}, l.label)));
  values.forEach((v, i) => bars.append(el("div", { class: "b " + cls(v, i), style: `height:${Math.max(2, ((v ?? 0) / top) * 100)}%`, title: labels[i] ? labels[i] + ": " + v : String(v) })));
  wrap.append(bars);
  if (labels.length) wrap.append(el("div", { class: "axis" }, labels.map((l) => el("span", {}, l))));
  return wrap;
}
async function loadDashboard() {
  const d = await api("/api/dashboard").catch(() => null);
  if (!d) return;
  const st = d.stats, bs = st.by_status || {};
  const quotedN = ["quoted", "accepted", "booked", "confirmed"].reduce((a, k) => a + (bs[k] || 0), 0);
  const bookedN = (bs.booked || 0) + (bs.confirmed || 0);
  const missed = (bs.expired || 0) + (bs.error || 0);
  const acc = (st.board || {}).accepted || 0, rej = (st.board || {}).rejected || 0;
  const avgCost = st.avg_llm_cost_micro_usd_per_quote, avgResp = st.avg_response_s;
  const estPts = (costPts(avgCost) ?? 0) + (timePts(avgResp) ?? 0);

  const kpis = el("div", { class: "kpi-grid" },
    kpi("mail", "Sessions", st.sessions_total, `${missed} verpasst/Fehler · ${d.unassigned} unzugeordnet`, missed ? "warn" : ""),
    kpi("send", "Quotiert", quotedN, st.sessions_total ? Math.round(100 * quotedN / st.sessions_total) + " % der Sessions" : ""),
    kpi("box", "Gebucht", bookedN, `${d.bookings.length} Buchungen gesamt`),
    kpi("clock", "Ø Antwortzeit", secs(avgResp), "Ziel ≤ 2:00 · " + (timePts(avgResp) ?? 0).toFixed(1) + "/15 P", avgResp == null ? "" : avgResp <= 120 ? "ok" : avgResp <= 300 ? "warn" : "bad"),
    kpi("coin", "Ø LLM-Kosten / Quote", usd(avgCost), "0 P bei $0.10 · " + (costPts(avgCost) ?? 0).toFixed(1) + "/40 P", avgCost == null ? "" : avgCost <= 10000 ? "ok" : avgCost <= 50000 ? "warn" : "bad"),
    kpi("trophy", "Board", `${acc} / ${acc + rej}`, "accepted / bewertet", acc + rej ? (acc / (acc + rej) >= .8 ? "ok" : "warn") : ""),
    kpi("activity", "Geschätzt Kosten+Zeit", estPts.toFixed(1) + " P", "von 55 je Quote (ohne Preis)"),
    kpi("coin", "LLM gesamt", usd(d.llm_total_micro_usd), "alle Gateway-Calls"),
  );

  // status distribution
  const order = ["new", "pricing", "quoted", "accepted", "booked", "confirmed", "answered", "lost", "expired", "error"];
  const color = { new: "--st-new", pricing: "--st-pricing", quoted: "--st-quoted", accepted: "--st-booked", booked: "--st-booked", confirmed: "--ok", answered: "--st-booked", lost: "--st-error", expired: "--warn", error: "--bad" };
  const total = Math.max(1, st.sessions_total);
  const stack = el("div", { class: "stack" }), legend = el("div", { class: "legend" });
  for (const k of order) if (bs[k]) {
    stack.append(el("span", { style: `width:${100 * bs[k] / total}%;background:var(${color[k]})`, title: STATUS_DE[k] + ": " + bs[k] }));
    legend.append(el("span", {}, el("i", { style: `background:var(${color[k]})` }), `${STATUS_DE[k]} ${bs[k]}`));
  }
  const statusCard = el("div", { class: "card" }, el("h3", {}, icon("list"), "Status aller Sessions"), stack, legend);

  // hourly volume
  const hours = d.hourly.map((h) => h.hour.slice(11, 13) + "h");
  const hourly = el("div", { class: "card" }, el("h3", {}, icon("chart"), "RFQs pro Stunde (grau) · beantwortet (grün)"),
    d.hourly.length ? el("div", { style: "position:relative" },
      barChart(d.hourly.map((h) => h.sessions), { labels: hours, cls: () => "ghost" }),
      el("div", { style: "position:absolute;inset:0" }, barChart(d.hourly.map((h) => h.answered), { max: Math.max(...d.hourly.map((h) => h.sessions)), labels: [], cls: () => "ok" }))
    ) : el("div", { class: "d-sub" }, "Noch keine Daten."));

  // per-quote response time + cost (oldest → newest)
  const qs = [...d.quotes].reverse();
  const respCard = el("div", { class: "card" }, el("h3", {}, icon("clock"), "Antwortzeit je Quote (s)"),
    qs.length ? barChart(qs.map((q) => q.response_s == null ? 0 : Math.round(q.response_s)), { max: 360, lines: [{ v: 120, label: "2 min" }, { v: 360, label: "6 min" }], cls: (v) => v <= 120 ? "ok" : v <= 300 ? "warn" : "bad" }) : el("div", { class: "d-sub" }, "Noch keine Quotes."));
  const costCard = el("div", { class: "card" }, el("h3", {}, icon("coin"), "LLM-Kosten je Quote (µ$)"),
    qs.length ? barChart(qs.map((q) => q.llm_cost_micro_usd), { lines: [Math.max(...qs.map((q) => q.llm_cost_micro_usd || 0)) < 5000 ? { v: 1000, label: "$0.001" } : { v: 10000, label: "$0.01" }], cls: (v) => v === 0 ? "bad" : v <= 10000 ? "ok" : v <= 50000 ? "warn" : "bad" }) : el("div", { class: "d-sub" }, "Noch keine Quotes."),
    qs.some((q) => !q.llm_cost_micro_usd) ? el("div", { class: "d-sub", style: "margin-top:6px;color:var(--bad)" }, "Rot = Quote ohne Gateway-Call → 0 Kostenpunkte!") : null);

  // quotes table
  const qt = el("table", { class: "tbl" }, el("tr", {}, ...["Zeit", "Lane", "Airline", "Quelle", "Preis", "Antwort", "LLM", "Board", ""].map((h, i) => el("th", { class: i >= 4 && i <= 6 ? "num" : "" }, h))));
  for (const q of d.quotes) qt.append(el("tr", { style: "cursor:pointer", onclick: () => { showView("sessions-view"); select(q.session_id); } },
    el("td", {}, time(q.sent_at)), el("td", {}, `${q.origin || "?"} → ${q.destination || "?"}`), el("td", {}, q.airline || ""), el("td", {}, q.source || ""),
    el("td", { class: "num" }, money(q.total_minor, q.currency)), el("td", { class: "num" }, secs(q.response_s)), el("td", { class: "num" }, usd(q.llm_cost_micro_usd)),
    el("td", {}, q.verdict ? el("span", { class: "pill " + (q.verdict === "accepted" ? "booked" : q.verdict === "rejected" ? "error" : "new") }, q.verdict) : "–"),
    el("td", {}, el("span", { class: "pill " + q.status }, STATUS_DE[q.status] || q.status))));
  const quotesCard = el("div", { class: "card" }, el("h3", {}, icon("send"), "Quotes (neueste zuerst, Klick öffnet Session)"), d.quotes.length ? qt : el("div", { class: "d-sub" }, "Noch keine Quotes."));

  const bt = el("table", { class: "tbl" }, el("tr", {}, ...["Referenz", "Kunde", "Airline", "Preis", "Status"].map((h, i) => el("th", { class: i === 3 ? "num" : "" }, h))));
  for (const b of d.bookings) bt.append(el("tr", { style: "cursor:pointer", onclick: () => { showView("sessions-view"); select(b.session_id); } },
    el("td", {}, b.booking_reference || b.team_reference), el("td", {}, b.customer || ""), el("td", {}, b.airline || ""), el("td", { class: "num" }, money(b.price_minor, b.currency)),
    el("td", {}, el("span", { class: "pill " + (b.status === "failed" ? "error" : "booked") }, b.status))));
  const bookingsCard = el("div", { class: "card" }, el("h3", {}, icon("box"), "Buchungen"), d.bookings.length ? bt : el("div", { class: "d-sub" }, "Noch keine Buchungen."));

  const ticker = el("ul", { class: "tl ticker", id: "ticker" });
  const tickerCard = el("div", { class: "card" }, el("h3", {}, icon("activity"), "Live-Ereignisse (alle Sessions)"), ticker);

  $("#dashboard-view").replaceChildren(kpis, el("div", { class: "dash-grid" }, statusCard, hourly, respCard, costCard), quotesCard, el("div", { class: "dash-grid" }, bookingsCard, tickerCard));
  const recent = await api("/api/events?since=" + Math.max(0, state.lastEventId - 30)).catch(() => []);
  for (const e of recent.reverse()) ticker.append(eventItem(e));
}

// ---------- live stream ----------
let refreshTimer = null;
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    loadSessions(); loadStats();
    if (state.view === "dashboard-view") loadDashboard();
  }, 400);
}
function onEvent(e) {
  if (state.seen.has(e.id)) return;
  state.seen.add(e.id);
  state.lastEventId = Math.max(state.lastEventId, e.id);
  if (state.detail && e.session_id === state.selected) {
    const tl = $("#timeline"); if (tl) tl.append(eventItem(e, true));
    if (["mail_in", "mail_out", "quoted", "booked", "status", "human_action", "board_verdict", "extracted"].includes(e.kind)) loadDetail();
  }
  const tk = $("#ticker"); if (tk) tk.prepend(eventItem(e, true));
  scheduleRefresh();
}
function connect() {
  const es = new EventSource("/api/stream?since=" + state.lastEventId);
  es.onopen = () => { $("#live-dot").className = "dot on"; $("#live-text").textContent = "live"; };
  es.onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch (err) { console.warn(err); } };
  es.onerror = () => { $("#live-dot").className = "dot retry"; $("#live-text").textContent = "verbinde neu…"; };
}

// ---------- views & boot ----------
function showView(id) {
  state.view = id;
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === id));
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.view === id));
  const tab = document.querySelector(`.tab[data-view="${id}"]`);
  if (tab) $("#page-title").replaceChildren(tab.querySelector("svg").cloneNode(true), el("span", {}, tab.textContent.trim()));
  if (id === "dashboard-view") loadDashboard();
}
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => showView(t.dataset.view)));
// theme switch (dark default, light via data-theme; remembered per browser)
function renderThemeToggle() {
  const light = document.documentElement.dataset.theme === "light";
  const btn = $("#theme-toggle");
  btn.replaceChildren(icon(light ? "moon" : "sun"), el("span", {}, light ? "Dunkles Design" : "Helles Design"));
}
$("#theme-toggle").addEventListener("click", () => {
  const light = document.documentElement.dataset.theme !== "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("theme", light ? "light" : "dark"); } catch {}
  renderThemeToggle();
});
renderThemeToggle();
$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); renderList(); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  const rows = state.sessions.filter(matches); const i = rows.findIndex((s) => s.id === state.selected);
  if (e.key === "j" && rows[i + 1]) select(rows[i + 1].id);
  if (e.key === "k" && i > 0) select(rows[i - 1].id);
  if (e.key === "p" && state.detail) act(state.detail.paused ? "resume" : "pause")();
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});
setInterval(() => { loadSessions(); loadStats(); }, 15000); // safety net if the stream stalls

(async function boot() {
  renderChips();
  const last = await api("/api/events?since=0&limit=500").catch(() => []);
  state.lastEventId = last.length ? last[last.length - 1].id : 0;
  last.forEach((e) => state.seen.add(e.id));
  await Promise.all([loadSessions(), loadStats()]);
  const m = location.hash.match(/session=(\d+)/);
  if (m) select(Number(m[1]));
  connect();
})();
</script>
