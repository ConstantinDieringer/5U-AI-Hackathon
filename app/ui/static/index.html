<!doctype html>

<style>
/* Tokens: DESIGN.md v0.5 §2 (Apple softness on Twenty structure). Components use tokens only. */
:root {
  --canvas: #F6F6F7; --card: #FFFFFF; --glass: rgba(246,246,247,.82);
  --fill-1: #F2F2F4; --fill-2: #E8E8EC; --hover: rgba(0,0,0,.035); --pressed: rgba(0,0,0,.07);
  --hairline: #F0F0F2; --hairline-strong: #E6E6EA; --border-strong: #D4D4DA;
  --ink: #232326; --ink-2: #66666E; --ink-3: #9A9AA2; --ink-4: #B8B8BF;
  --blue: #2F6FEB; --blue-tint: #EAF1FE; --blue-ink: #2257C9;
  --green: #3FB36A; --green-tint: #E7F6EC; --green-ink: #24854A;
  --orange: #F08A24; --orange-tint: #FDF0DF; --orange-ink: #B95A00;
  --indigo: #6E56CF; --indigo-tint: #F0EDFC; --indigo-ink: #5B43B8;
  --red: #E5484D; --red-tint: #FCEBEC; --red-ink: #C4323A;
  --font: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "SF Mono", "DM Mono", ui-monospace, Menlo, monospace;
  --r-pill: 999px; --r-xs: 4px; --r-sm: 8px; --r-md: 10px; --r-card: 14px; --r-xl: 18px;
  --shadow-card: 0 1px 2px rgba(0,0,0,.03), 0 4px 14px rgba(0,0,0,.035);
  --shadow-light: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.02);
  --shadow-float: 0 10px 32px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
  --gap: 16px; --pad: 20px; --sidebar: 228px; --inset: 12px;
  --fast: 120ms; --mid: 260ms; --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-reduced-motion: reduce) { :root { --fast: 0ms; --mid: 0ms; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); font: 400 14px/1.45 var(--font); letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.icon { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.r { text-align: right; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.caption { font-size: 12px; line-height: 16px; font-weight: 450; color: var(--ink-3); }

/* ---------- shell: flat sidebar, cards float on the canvas ---------- */
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar); z-index: 20; background: var(--canvas);
  border-right: 1px solid var(--hairline-strong); display: flex; flex-direction: column; padding: 16px 12px; gap: 2px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 20px; }
.brand .mark { width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--blue), var(--indigo)); box-shadow: var(--shadow-light); }
.brand .mark .icon { width: 15px; height: 15px; }
.brand b { display: block; font-size: 14px; font-weight: 600; }
.brand small { display: block; color: var(--ink-3); font-size: 12px; }
.nav { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; background: none;
  border-radius: var(--r-sm); color: var(--ink-2); font-weight: 500; text-align: left; transition: background var(--fast), color var(--fast), box-shadow var(--fast); }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow-light); }
.nav .icon { color: var(--ink-3); } .nav:hover .icon { color: var(--ink-2); } .nav.active .icon { color: var(--blue); }
.nav .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); background: var(--orange-tint); color: var(--orange-ink); font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.nav .badge:empty { display: none; }
.nav .badge.err { background: var(--red-tint); color: var(--red-ink); }
.sidebar .spacer { flex: 1; }
.conn { display: flex; align-items: center; gap: 8px; padding: 8px 10px; color: var(--ink-3); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-4); flex: none; }
.dot.on { background: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
.dot.retry { background: var(--orange); }
.stop { margin: 4px 0 0; height: 34px; border-radius: var(--r-sm); border: 1px solid transparent; background: var(--red-tint); color: var(--red-ink); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: border-color var(--fast); }
.stop:hover { border-color: var(--red); }
.stop.on { background: var(--red); color: #fff; }

.main { margin-left: var(--sidebar); min-height: 100vh; padding: 0 24px 40px; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 12px 0; margin-bottom: 8px;
  background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.6); backdrop-filter: blur(16px) saturate(1.6); }
.topbar h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.topbar .sub { display: none; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.search { display: flex; align-items: center; gap: 8px; height: 36px; width: 280px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--hairline-strong); background: var(--card); color: var(--ink-3); box-shadow: var(--shadow-light); transition: border-color var(--fast), box-shadow var(--fast); }
.search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-tint); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 11px; color: #fff; background: linear-gradient(135deg, var(--indigo), var(--blue)); }
.banner { display: none; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: var(--gap); border-radius: var(--r-md); background: var(--red-tint); color: var(--red-ink); font-weight: 600; }
.banner.show { display: flex; }
.page { display: none; } .page.active { display: block; }
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); max-width: 1400px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }

/* ---------- components ---------- */
.card { background: var(--card); border: 1px solid var(--hairline-strong); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: var(--pad); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h h3 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -0.01em; }
.card-h .aside { margin-left: auto; }
#overview .card-h > div, #errors .card-h > div { min-width: 0; flex: 1; }
#overview .card-h .aside, #errors .card-h .aside { flex-shrink: 0; }
#errors .card-h > .seg { flex: 0 0 auto; }
.linklike { border: 0; background: none; padding: 0; color: inherit; font: inherit; cursor: pointer; text-align: left; }
.linklike:hover b { text-decoration: underline; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--fill-1); border-radius: var(--r-sm); }
.seg button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 6px; color: var(--ink-2); font-weight: 500; transition: background var(--fast), color var(--fast); }
.seg button:hover { color: var(--ink); }
.seg button.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow-light); }
.btn { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 13px; border-radius: var(--r-sm); border: 1px solid var(--hairline-strong); background: var(--card); color: var(--ink); font-weight: 500; box-shadow: var(--shadow-light); transition: background var(--fast); white-space: nowrap; }
.btn:hover { background: var(--fill-1); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-ink); }
.btn.ghost { border-color: transparent; background: none; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); }
.badge-s { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 6px; font-size: 12px; font-weight: 550; white-space: nowrap; background: var(--fill-1); color: var(--ink-2); }
.badge-s.blue { background: var(--blue-tint); color: var(--blue-ink); }
.badge-s.green { background: var(--green-tint); color: var(--green-ink); }
.badge-s.orange { background: var(--orange-tint); color: var(--orange-ink); }
.badge-s.indigo { background: var(--indigo-tint); color: var(--indigo-ink); }
.badge-s.red { background: var(--red-tint); color: var(--red-ink); }
.kpi .label { color: var(--ink-2); font-size: 13px; font-weight: 500; }
.kpi .value { font-size: 28px; line-height: 34px; font-weight: 650; letter-spacing: -0.03em; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.kpi .meta { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 12px; min-height: 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
table.list { width: 100%; border-collapse: collapse; }
.list th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); height: 34px; padding: 0 10px; border-bottom: 1px solid var(--hairline-strong); white-space: nowrap; }
.list td { height: 44px; padding: 0 10px; border-bottom: 1px solid var(--hairline); white-space: nowrap; color: var(--ink); font-size: 13px; }
.list tbody tr { cursor: pointer; transition: background var(--fast); }
.list tbody tr:hover { background: var(--hover); }
.list tbody tr:last-child td { border-bottom: 0; }
.list td.wrap { white-space: normal; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who .ini { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none; }
.who .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 32px 12px; color: var(--ink-3); text-align: center; }
.empty .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-1); color: var(--ink-3); }
.attn-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px; border-radius: var(--r-md); cursor: pointer; transition: background var(--fast); }
.attn-item:hover { background: var(--hover); }
.attn-item .ic { width: 30px; height: 30px; border-radius: var(--r-sm); display: grid; place-items: center; flex: none; }
.attn-item .t { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attn-item .d { font-size: 12px; color: var(--ink-3); }
.attn-item.quarantine { align-items: center; }
.attn-item .d.why { color: var(--ink-3); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; flex: none; }

/* ---------- overview: checks, score, steps ---------- */
.checks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.check { border-radius: var(--r-md); padding: 14px; background: var(--fill-1); min-width: 0; }
.check .ck-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.check .lamp { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--ink-3); }
.check.ok .lamp { background: var(--green); box-shadow: 0 0 0 3px var(--green-tint); }
.check.warn { background: var(--orange-tint); } .check.warn .lamp { background: var(--orange); }
.check.bad { background: var(--red-tint); } .check.bad .lamp { background: var(--red); }
.check .ck-v { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.03em; margin: 6px 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check .ck-hint { font-size: 12px; line-height: 16px; color: var(--ink-2); }
#overview .ck-h span, #overview .ck-hint, #overview .attn-item .d { min-width: 0; overflow-wrap: anywhere; }
.big { font-size: 40px; line-height: 46px; font-weight: 650; letter-spacing: -0.03em; }
.big .of { font-size: 20px; color: var(--ink-3); letter-spacing: -0.02em; }
.bar { margin-bottom: 14px; }
.bar-h { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.bar-h b { color: var(--ink); font-weight: 600; }
.bar-h { min-width: 0; flex-wrap: wrap; }
.bar-h > span { min-width: 0; overflow-wrap: anywhere; }
.bar-h > b { flex-shrink: 0; }
.bar-t { height: 8px; border-radius: var(--r-pill); background: var(--fill-1); overflow: hidden; }
.bar-t i { display: block; height: 100%; border-radius: var(--r-pill); }
.verdicts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.verdicts .badge-s { max-width: 100%; min-height: 22px; height: auto; padding-top: 3px; padding-bottom: 3px; white-space: normal; overflow-wrap: anywhere; }
.req { display: flex; flex-direction: column; line-height: 18px; min-width: 0; }
.req span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.steps td { height: 58px; }
.table-scroll { width: 100%; min-width: 0; max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; }
table.steps { table-layout: fixed; min-width: 560px; }
.steps .col-time { width: 10%; } .steps .col-request { width: 30%; } .steps .col-quote { width: 22%; }
.steps .col-board { width: 18%; } .steps .col-booking { width: 20%; }
.steps th, .steps td { padding-left: 8px; padding-right: 8px; }
.steps .req { max-width: 100%; }
.steps .req b, .steps .req span { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step { display: inline-flex; align-items: center; gap: 4px; max-width: 190px; height: 24px; padding: 0 10px 0 8px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600; background: var(--fill-1); color: var(--ink-2); }
.step span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps .step { max-width: 100%; min-width: 0; vertical-align: middle; }
.steps .step span { min-width: 0; }
.step .icon { width: 14px; height: 14px; stroke-width: 2.25; }
.step.green { background: var(--green-tint); color: var(--green-ink); } .step.blue { background: var(--blue-tint); color: var(--blue); }
.step.orange { background: var(--orange-tint); color: var(--orange-ink); } .step.red { background: var(--red-tint); color: var(--red-ink); }

/* ---------- overview v0.3: status strip + problems feed ---------- */
.strip { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 16px 20px; }
.strip .verdict { display: flex; align-items: center; gap: 12px; min-width: 0; }
.strip .verdict .lamp { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.strip .verdict b { font-size: 20px; line-height: 26px; letter-spacing: -0.02em; }
.lamp.green { background: var(--green); box-shadow: 0 0 0 4px var(--green-tint); }
.lamp.orange { background: var(--orange); box-shadow: 0 0 0 4px var(--orange-tint); }
.lamp.red { background: var(--red); box-shadow: 0 0 0 4px var(--red-tint); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); background: var(--fill-1); font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.pill.ok i { background: var(--green); } .pill.warn { background: var(--orange-tint); color: var(--orange-ink); } .pill.warn i { background: var(--orange); }
.pill.bad { background: var(--red-tint); color: var(--red-ink); } .pill.bad i { background: var(--red); }
.strip .score { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.strip .score b { font-size: 22px; letter-spacing: -0.03em; }
.prob { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; padding: 12px; border-radius: var(--r-md); align-items: start; }
.prob + .prob { border-top: 1px solid var(--hairline); border-radius: 0; }
.prob .ic { width: 32px; height: 32px; border-radius: var(--r-sm); display: grid; place-items: center; }
.prob.error .ic { background: var(--red-tint); color: var(--red); } .prob.warn .ic { background: var(--orange-tint); color: var(--orange); }
.prob .msg { font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.prob .msg.full { -webkit-line-clamp: unset; display: block; }
.prob .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.prob .count { font: 700 15px/20px var(--font); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.prob .count small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.prob.fresh { background: var(--red-tint); }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--r-pill); background: var(--fill-1); color: var(--ink); font-size: 12px; font-weight: 500; border: 0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.chip:hover { background: var(--blue-tint); color: var(--blue); }
.probs { max-height: 560px; overflow: auto; margin: 0 -12px; padding: 0 12px; }
/* ---------- live ---------- */
.request-detail { max-width: 1360px; min-width: 0; }
.cd { font: 600 13px/18px var(--mono); color: var(--ink-2); text-align: right; }
.cd.warn { color: var(--orange); } .cd.bad { color: var(--red); }
.detail-head { display: flex; gap: 16px; align-items: flex-start; }
.detail-head h2 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 650; letter-spacing: -0.02em; }
.detail-head .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; color: var(--ink-2); font-size: 13px; }
.detail-head .cd { margin-left: auto; font-size: 30px; line-height: 36px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); margin-top: 14px; background: var(--orange-tint); color: var(--orange-ink); font-size: 13px; font-weight: 500; }

.stack { display: flex; flex-direction: column; gap: var(--gap); }
.why-total { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.why-total b { font-size: 22px; font-weight: 600; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; }
.tl li:last-child { border-bottom: 0; }
.tl .time { font: 12px/20px var(--mono); color: var(--ink-3); }
.tl .x { font: 12px/20px var(--mono); color: var(--ink-3); }
.tl li.warn .msg { color: var(--orange-ink); } .tl li.error .msg { color: var(--red-ink); }
.tl li.fresh { animation: flash 1.2s var(--ease); }
@keyframes flash { from { background: var(--blue-tint); } to { background: transparent; } }
.tl details { grid-column: 2 / 4; } summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
pre { white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; font: 12px/18px var(--mono); color: var(--ink-2); }

.session-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); margin: var(--gap) 0; align-items: start; }
.session-metrics .card { height: 100%; }
.session-metrics .why-total { align-items: flex-start; gap: 8px; }
.session-metrics .why-total b { font-size: 26px; line-height: 32px; overflow-wrap: anywhere; }
.session-metrics .why-total span { font-size: 12px; line-height: 18px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; margin: 0; }
.facts dt { color: var(--ink-2); font-size: 12px; }
.facts dd { margin: 3px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.flow-steps { display: flex; justify-content: space-between; gap: 10px; margin: 18px 0; }
.flow-step { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.flow-step .flow-dot { width: 28px; height: 28px; display: grid; place-items: center; background: var(--fill-1); color: var(--ink-2); border-radius: var(--r-pill); }
.flow-step.done .flow-dot { color: var(--green); background: var(--green-tint); }
.flow-step b { font-size: 12px; }
.flow-step small { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.detail-back { margin-bottom: 14px; }
.detail-head > div { min-width: 0; }

  if (!q) { c.append(emptyState("clock", OPEN.includes(s.status) ? "No quote yet. The agent is pricing." : "No quote in this session.")); return c; }
  const pref = s.request && (s.request.preference || s.request.mode);
  c.append(el("div", { class: "why-total" }, el("b", {}, money(q.total_minor, q.currency)), el("span", { class: "muted" }, [q.airline, q.transit_days != null ? q.transit_days + " days" : null, "source " + q.source, pref ? "requested: " + pref : null].filter(Boolean).join(" · "))));
  const alts = [...(q.alternatives || [])].filter((a) => a.airline).sort((a, b) => ((a.total_minor ?? a.total_eur_minor) ?? 1e18) - ((b.total_minor ?? b.total_eur_minor) ?? 1e18));
  if (!alts.length) { c.append(el("div", { class: "faint" }, "No alternatives stored.")); return c; }
  const t = el("table", { class: "list" }, el("thead", {}, el("tr", {}, el("th", {}, "Airline"), el("th", {}, "Source"), el("th", { class: "r" }, "Days"), el("th", { class: "r" }, "Price"))), el("tbody", {}));
  for (const a of alts) { const total = a.total_minor ?? a.total_eur_minor, ch = a.airline === q.airline;
    t.tBodies[0].append(el("tr", { style: "cursor:default" + (ch ? ";color:var(--green-ink);font-weight:600" : "") }, el("td", {}, (ch ? "✓ " : "") + a.airline), el("td", { class: "muted" }, a.source || ""), el("td", { class: "r num" }, a.transit_days ?? ""), el("td", { class: "r num" }, money(total, a.currency || "EUR")))); }
  c.append(t); return c; }
function bookingCard(s) { const b = s.bookings[0];
  return el("div", { class: "card" }, el("div", { class: "card-h" }, el("h3", {}, "Booking"), el("span", { class: "aside badge-s " + (b.status === "failed" ? "red" : "green") }, b.status)),
    el("div", { style: "font-size:22px;font-weight:700;letter-spacing:-.03em" }, b.booking_reference || b.team_reference),
    el("div", { class: "muted", style: "margin-top:4px" }, [b.airline, money(b.price_minor, b.currency), "Rate " + (b.rate_id || "–")].join(" · "))); }
function verdictBadge(v) { return el("span", { class: "badge-s " + (v === "accepted" ? "green" : ["open", "pending"].includes(v) ? "blue" : "red") }, v || "?"); }
function boardCard(s) { const c = el("div", { class: "card" }, el("div", { class: "card-h" }, el("h3", {}, "5U rating")));
  if (!s.board.length) c.append(el("div", { class: "faint" }, "No rating yet."));
  for (const b of s.board) c.append(el("div", { style: "display:flex;gap:8px;align-items:center" }, verdictBadge(b.verdict), el("span", { class: "muted" }, b.reason || ""))); return c; }
function toggleReply(on, focus = true) { const r = $("#reply"); if (!r) return; r.style.display = on ? "block" : "none"; S.reply.open = on; if (on && focus) $("#reply-text").focus(); }
let DRAFT = null;
async function loadDraft() {
  const sid = S.selected; toggleReply(true); let info = $("#draft-info"); info.textContent = "Pricing from tariff sheet, portal and bids …"; DRAFT = null;
  try {
    const d = await post(`/api/sessions/${sid}/draft`); if (S.selected !== sid) return;
    info = $("#draft-info");
    const customerMail = replyMails(S.detail).find((mail) => isCustomerMail(mail, S.detail));
    if (customerMail) { $("#reply-mail").value = String(customerMail.id); syncSelect($("#reply-mail")); }
    DRAFT = d; $("#reply-text").value = d.body; $("#reply-text").style.minHeight = "300px";
    const opts = d.options.slice(0, 4).map((o) => `${o.airline.split(" ")[0]} ${o.transit_days} d ${euro(o.eur_minor)}`).join(" · ");
    info.replaceChildren(el("b", {}, `Draft: ${money(d.total_minor)} · ${d.choice.airline} · ${d.preference === "fastest" ? "fastest" : "cheapest"}`),
      d.truck ? ` · truck ${d.truck.name} ${euro(d.truck.eur_minor)}` : "", el("br"), "Options: " + opts,
      ...d.warnings.map((w) => el("div", { style: "color:var(--orange-ink)" }, "⚠ " + w)));
  } catch (e) { if (S.selected !== sid) return; $("#draft-info").textContent = "Draft could not be created. Details in Settings messages."; bufferMessage("No draft possible: " + e.message, "error", sid); }
}
async function sendReply() {
  const sid = S.selected, text = $("#reply-text").value.trim(); if (!text) return;
  const mail_id = Number($("#reply-mail").value);
  const target = S.detail.mails.find(mail => mail.id === mail_id && mail.direction === "in");
  if (!target) { bufferMessage("Please choose an incoming mail to reply to.", "warn", sid); return; }
  const quote = DRAFT && text.includes(mailAmount(DRAFT.total_minor)) ? DRAFT : null;
  if (quote && !isCustomerMail(target, S.detail)) { bufferMessage("A customer quote can only be sent to the customer.", "warn", sid); return; }
  if (!confirm(`Send the reply to ${target.sender} now? This takes over the request.`)) return;
  try {
    await post(`/api/sessions/${sid}/reply`, { text, quote, mail_id });
    if (S.selected !== sid) return;
    S.reply = {}; DRAFT = null; toggleReply(false); $("#reply-text").value = "";
    await Promise.all([loadDetail(), loadSessions()]);
  } catch (e) {
    bufferMessage("Send failed: " + e.message, "error", sid);
    if (S.selected === sid) $("#draft-info").textContent = "Not sent. Your draft is kept. Details in Settings messages.";
  }
}

// ---------- CRM ----------
// ---------- CRM ----------
async function loadCrm() { if(isSelectOpen())return; S.crm = await api("/api/crm").catch(() => S.crm); renderCrm(); }
async function openCustomer(c) {
  $("#drawer-title").textContent = c.customer.replace("@hackloop.mail", "");
  const sessions = await api("/api/customers/" + encodeURIComponent(c.customer) + "/sessions").catch(() => []);
  $("#drawer-body").replaceChildren(el("div", { class: "mini" }, el("div", {}, el("span", { class: "caption" }, "Requests"), el("b", {}, c.requests)), el("div", {}, el("span", { class: "caption" }, "Won"), el("b", { style: "color:var(--green-ink)" }, c.won)), el("div", {}, el("span", { class: "caption" }, "Booking rate"), el("b", {}, pct(c.won, c.requests)))),
    el("div", { class: "caption", style: "margin-bottom:8px" }, "History"),
    sessions.length ? el("table", { class: "list" }, el("tbody", {}, ...sessions.map((s) => el("tr", { onclick: () => { closeDrawer(); select(s.id); } }, el("td", { class: "muted" }, dateTime(s.created_at)), el("td", { class: "wrap" }, s.subject || ""), el("td", {}, badge(s.status)), el("td", { class: "r num" }, s.quote_total_minor != null ? money(s.quote_total_minor, s.quote_currency) : "–"))))) : emptyState("inbox", "No sessions."));
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
}
function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#drawer-close").addEventListener("click", closeDrawer); $("#scrim").addEventListener("click", closeDrawer);

// ---------- global pause ----------
async function loadStats() { const st = await api("/api/stats").catch(() => null); if (!st) return; S.globalPause = !!st.global_pause;
  const b = $("#global-pause"); b.classList.toggle("on", S.globalPause); b.querySelector("span").textContent = S.globalPause ? "Release mail" : "Stop mail"; $("#global-banner").classList.toggle("show", S.globalPause); }
$("#global-pause").addEventListener("click", async () => { const stop = !S.globalPause;
  if (stop && !confirm("Stop all outgoing mail? The agent then sends nothing, not even quotes.")) return;
  await post(stop ? "/api/pause-all" : "/api/resume-all").catch(e => bufferMessage("Could not change the global mail stop. " + e.message, "error", null)); await loadStats(); if (S.detail) renderDetail(); });

// ---------- live stream ----------
let refreshT = null;
function refreshSoon() {
  clearTimeout(refreshT); refreshT = setTimeout(() => {
    loadStats(); if (S.page === "overview") loadOverview(); if (S.page === "requests") loadRequests(); if (S.page === "session") loadSessions(); if (S.page === "crm") loadCrm(); if (S.page === "errors") loadErrors();
  }, 500);
}
function onEvent(e) {
  if(["extracted","quoted","mail_in"].includes(e.kind))S.airportOptions=null;
  if (S.seen.has(e.id)) return; S.seen.add(e.id); S.lastId = Math.max(S.lastId, e.id);
  if (S.detail && e.session_id === S.selected) {
    const tl = $("#timeline"); if (tl) { tl.append(eventItem(e)); $("#timeline-count").textContent = tl.children.length + " events"; }
    if (["mail_in", "mail_out", "quoted", "booked", "status", "human_action", "board_verdict", "extracted", "llm_call"].includes(e.kind)) loadDetail();
  }
  if (["warn", "error"].includes(e.level)) {
    clearTimeout(S.bufferRefresh); S.bufferRefresh = setTimeout(async () => {
      const p = await api("/api/problems?hours=24").catch(() => null); if (p) { PROBLEMS = p; errBadge(); if (S.page === "errors") loadErrors(); }
    }, 500);
  }
  refreshSoon();
}
function connect() { const es = new EventSource("/api/stream?since=" + S.lastId);
  es.onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch (err) { console.warn(err); } };
  // EventSource reconnects automatically without a status badge.
}

// ---------- keyboard & boot ----------
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer(); if (e.target.matches("input, textarea, select, [role=combobox], [role=option]") || e.target.closest(".select-popover") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "p" && S.detail && S.page === "session") act(S.detail.paused ? "resume" : "pause")();
  if (e.key === "/") { e.preventDefault(); $("#global-q").focus(); }
});
setInterval(() => { loadStats(); if (S.page === "overview") loadOverview(); else if (S.page === "requests") loadRequests(); else if (S.page === "session") loadDetail(); }, 20000);
function routeFromHash() {
  const hash = location.hash, match = hash.match(/^#session=(\d+)$/);
  if (match) select(Number(match[1]), false); else show(hash === "#requests" ? "requests" : hash === "#crm" ? "crm" : hash === "#rates" ? "rates" : hash === "#errors" ? "errors" : "overview", false);
}
window.addEventListener("popstate", routeFromHash);
window.addEventListener("hashchange", routeFromHash);
window.addEventListener("error", e => bufferMessage("Display error: " + e.message, "error", null));
window.addEventListener("unhandledrejection", e => bufferMessage("Action could not be completed: " + (e.reason?.message || e.reason), "error", null));
(async function boot() {
  const ev = await api("/api/events?since=0&limit=500").catch(() => []); S.lastId = ev.length ? ev[ev.length - 1].id : 0; ev.forEach((e) => S.seen.add(e.id));
  await Promise.all([loadStats(), loadSessions()]);
  routeFromHash(); errBadge();
  connect();
})();
</script>
