# Tool settings only; dependencies stay in requirements.txt (TECH_SPEC §2).
[tool.pytest.ini_options]
markers = [
  "core: customer-facing and operational contracts for every product PR",
  "slow: replay and full-app tests (> 2 s each); skip while iterating with -m \"not slow\"",
]

[tool.ruff]
line-length = 100  # TECH_SPEC §2: ruff format and ruff check with line length 100
target-version = "py311"
